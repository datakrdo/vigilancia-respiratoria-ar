version: 2

models:
  - name: stg_indec_population
    description: >
      INDEC population estimate by department, one row per year (publish_date is
      1 July of that year) and department. The sex breakdown of the source is
      summed away here.
    columns:
      - name: publish_date
        tests:
          - not_null
      - name: department_id
        tests:
          - not_null
      - name: population
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [publish_date, province_id, department_id, department_name]

  - name: stg_respiratory
    description: >
      Acute respiratory infections (IRA) notifications. The dataset is published as
      rolling windows of one to three years, so consecutive files overlap and stay 1:1
      here (the latest revision per year is picked in `int_snvs_unified`). Three snapshots
      cut at Excel's 65,535-row limit are not ingested (see scripts/fetch_data.py).
    columns:
      - name: year
        tests:
          - not_null
      - name: epi_week
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 53
      - name: event
        tests:
          - not_null
      - name: _source_file
        tests:
          - not_null
